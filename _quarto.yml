project:
  type: book
  output-dir: docs
  resources: 
  - slides/
  - images/

book:
  title: "CASA0023 Remotely Sensing Cities and Environments Learning Diary"
  author: "Christy Choi"
  date: "2/1/2026"
  navbar:
    logo: images/casa_logo.jpg
    collapse: true
    collapse-below: lg
    background: light
    search: true
    reader-mode: true
    right:
      - icon: github
        href: "https://github.com/christychoicc/RSCE"

  chapters:
    - index.qmd
    - intro.qmd
    - summary.qmd
    - references.qmd


bibliography: references.bib

format:
  html:
    theme:
      #- cosmo
      #- brand
      light: [cosmo, flatly]
      dark: [cosmo, darkly]
    code-link: true
    
  pdf:
    documentclass: scrreprt

editor: visual

